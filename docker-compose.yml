# Despliegue con un comando: docker compose up -d --build
# Reinicio automático para contenedores persistentes en producción.

services:
  examen-telematica:
    build: .
    image: examen-telematica:latest
    container_name: examen-telematica
    ports:
      - "8080:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
